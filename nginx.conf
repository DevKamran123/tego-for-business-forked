server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # First attempt to serve the requested file, then fall back to index.html
        try_files $uri $uri/ /index.html;
    }

    # Custom error pages can be served here if needed
    error_page 404 /index.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}